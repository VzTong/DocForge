name: ci-fe

on:
  pull_request:
    paths:
      - "DocForge_FE/**"
      - ".github/workflows/ci-fe.yml"
  push:
    branches: [main]
    paths:
      - "DocForge_FE/**"
      - ".github/workflows/ci-fe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DocForge_FE

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: DocForge_FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build